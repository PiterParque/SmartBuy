name: Coletar Produtos

on:
  schedule:
    # Todo dia às 12h UTC
    - cron: '0 12 * * *'

  workflow_dispatch:

jobs:

  scraper:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # CLONAR REPOSITÓRIO
      # =========================

      - name: Clonar projeto
        uses: actions/checkout@v4

      # =========================
      # PYTHON
      # =========================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # =========================
      # DEPENDÊNCIAS DO SISTEMA
      # =========================

      - name: Instalar dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc

      # =========================
      # INSTALAR REQUIREMENTS
      # =========================

      - name: Instalar dependências Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # ENTRAR NA PASTA DO DJANGO
      # =========================

      - name: Rodar migrations
        working-directory: ./Site
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python manage.py migrate

      # =========================
      # EXECUTAR SCRAPER
      # =========================

      - name: Executar scraper
        working-directory: ./Site
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          PYTHONUNBUFFERED: 1
        run: |
          python manage.py coletar_produtos